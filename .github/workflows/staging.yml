name: Continuous Delivery - Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Maven project
        run: mvn --batch-mode clean verify
        working-directory: maven-automation-pipeline

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: staging
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare staging files
        run: |
          chmod +x deploy-staging.sh
          ./deploy-staging.sh
